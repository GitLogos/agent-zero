name: Build And Measure Image Profiles

on:
  push:
    branches:
      - image-rebuild
  workflow_dispatch:
    inputs:
      publish_experimental:
        description: Publish experimental tags only after all feature checks pass
        type: boolean
        default: false
      include_desktop:
        description: Include Xfce Desktop and file manager (shared Browser display is retained)
        type: boolean
        default: true
      include_office:
        description: Include LibreOffice/UNO creation, editing and export
        type: boolean
        default: true
      include_whisper:
        description: Include local CPU Whisper (off requires external STT configuration)
        type: boolean
        default: true
      include_kokoro:
        description: Include local CPU Kokoro (off requires external TTS or explicit browser speech)
        type: boolean
        default: true
      include_chromium:
        description: Include internal Chromium (off requires Host browser configuration)
        type: boolean
        default: true
      include_searxng:
        description: Include bundled search server (off requires A0_SEARXNG_URL)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  baseline:
    if: github.ref == 'refs/heads/image-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/gitlogos/agent-zero-slim:sha-67512fa
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Measure published amd64 baseline
        run: |
          set -euo pipefail
          mkdir -p measurements
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" > measurements/baseline-image.json
          docker history --no-trunc --format '{{json .}}' "$IMAGE" > measurements/baseline-history.jsonl
          docker manifest inspect "$IMAGE" > measurements/baseline-index.json
          digest="$(python3 -c 'import json; d=json.load(open("measurements/baseline-index.json")); print(next(m["digest"] for m in d["manifests"] if m["platform"].get("architecture")=="amd64" and m["platform"].get("os")=="linux"))')"
          docker manifest inspect "${IMAGE%:*}@$digest" > measurements/baseline-manifest.json
          docker run --rm --platform linux/amd64 \
            --entrypoint /opt/venv-a0/bin/python \
            -v "$PWD/docker/slim/inventory.py:/image-inventory.py:ro" \
            "$IMAGE" /image-inventory.py > measurements/baseline-filesystem.json
          python3 - <<'PY'
          import json
          image = json.load(open("measurements/baseline-image.json"))[0]
          fs = json.load(open("measurements/baseline-filesystem.json"))
          manifest = json.load(open("measurements/baseline-manifest.json"))
          print("Uncompressed image bytes:", image["Size"])
          print("Compressed layer bytes:", sum(layer["size"] for layer in manifest["layers"]))
          print("Merged filesystem allocated bytes:", fs["merged_filesystem_allocated_bytes"])
          print("Largest paths:", json.dumps(fs["paths"], indent=2))
          for site, packages in fs["python_distributions"].items():
              print(site)
              for package in packages[:15]:
                  print(package["name"], package["version"], package["logical_bytes"])
          print("UV exclusive/shared cache bytes:", json.dumps(fs["uv_cache"], indent=2))
          print("Large ELF section inventory:", json.dumps(fs["large_elf_files"], indent=2))
          PY
      - name: Distinguish existing baseline feature failures
        run: |
          set -euo pipefail
          docker run --name baseline-smoke --entrypoint bash \
            -v "$PWD/docker/slim:/checks:ro" "$IMAGE" -lc \
            'cp -r /git/agent-zero/. /a0/; cd /a0; PYTHONPATH=/a0 /opt/venv-a0/bin/python /checks/smoke.py --baseline --dockerized=true' \
            > measurements/baseline-smoke.log 2>&1 && status=0 || status=$?
          echo "Baseline feature check exit status: $status (diagnostic, not a candidate waiver)"
          docker cp baseline-smoke:/tmp/image-smoke-results.json measurements/baseline-smoke-results.json
          docker rm baseline-smoke
          cat measurements/baseline-smoke-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-baseline-amd64
          path: measurements
          if-no-files-found: error

  candidate:
    needs: baseline
    outputs:
      image_base: ${{ steps.profile.outputs.image_base }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE_REPOSITORY: ghcr.io/gitlogos/agent-zero-slim
      ARCHITECTURE: ${{ matrix.architecture }}
      INCLUDE_DESKTOP: ${{ github.event_name != 'workflow_dispatch' || inputs.include_desktop }}
      INCLUDE_OFFICE: ${{ github.event_name != 'workflow_dispatch' || inputs.include_office }}
      INCLUDE_WHISPER: ${{ github.event_name != 'workflow_dispatch' || inputs.include_whisper }}
      INCLUDE_KOKORO: ${{ github.event_name != 'workflow_dispatch' || inputs.include_kokoro }}
      INCLUDE_CHROMIUM: ${{ github.event_name != 'workflow_dispatch' || inputs.include_chromium }}
      INCLUDE_SEARXNG: ${{ github.event_name != 'workflow_dispatch' || inputs.include_searxng }}
    steps:
      - uses: actions/checkout@v4
      - name: Select component profile
        id: profile
        run: python3 docker/slim/image_profile.py
      - name: Free ephemeral runner build space
        run: |
          set -euo pipefail
          sudo rm -rf /opt/az /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/local/lib/android /usr/local/share/boost /usr/share/dotnet
          df -h /
          bash -n docker/run/fs/ins/install_A0.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/slim/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            BRANCH=image-rebuild
            A0_REPOSITORY_URL=https://github.com/${{ github.repository }}.git
            A0_BUILD_COMMIT=${{ github.sha }}
            A0_INCLUDE_DESKTOP=${{ env.INCLUDE_DESKTOP }}
            A0_INCLUDE_OFFICE=${{ env.INCLUDE_OFFICE }}
            A0_INCLUDE_WHISPER=${{ env.INCLUDE_WHISPER }}
            A0_INCLUDE_KOKORO=${{ env.INCLUDE_KOKORO }}
            A0_INCLUDE_CHROMIUM=${{ env.INCLUDE_CHROMIUM }}
            A0_INCLUDE_SEARXNG=${{ env.INCLUDE_SEARXNG }}
      - name: Measure candidate before starting services
        run: |
          set -euo pipefail
          mkdir -p measurements
          docker image inspect "$IMAGE" > measurements/candidate-image.json
          docker history --no-trunc --format '{{json .}}' "$IMAGE" > measurements/candidate-history.jsonl
          docker run --rm --entrypoint /opt/venv-a0/bin/python \
            -v "$PWD/docker/slim/inventory.py:/image-inventory.py:ro" \
            "$IMAGE" /image-inventory.py > measurements/candidate-filesystem.json
          docker run --rm --entrypoint git "$IMAGE" -C /git/agent-zero rev-parse HEAD | grep -Fx "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: image-baseline-amd64
          path: measurements/baseline
      - name: Compare measured sizes
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          baseline = json.load(open("measurements/baseline/baseline-image.json"))[0]["Size"]
          candidate = json.load(open("measurements/candidate-image.json"))[0]["Size"]
          result = {
              "architecture": os.environ["ARCHITECTURE"],
              "candidate_uncompressed_bytes": candidate,
              "baseline_amd64_uncompressed_bytes": baseline,
              "amd64_saved_bytes": baseline - candidate if os.environ["ARCHITECTURE"] == "amd64" else None,
              "amd64_three_gb_target_met": baseline - candidate >= 3_000_000_000 if os.environ["ARCHITECTURE"] == "amd64" else None,
              "included_features": json.load(open("measurements/candidate-filesystem.json"))["image_features"],
          }
          Path("measurements/comparison.json").write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Measured image footprint\n\n```json\n" + json.dumps(result, indent=2) + "\n```\n")
          PY
      - name: Run real startup
        id: startup
        run: |
          set -euo pipefail
          docker run -d --name image-smoke -p 127.0.0.1::80 \
            -v "$PWD/docker/slim:/checks:ro" "$IMAGE"
          port="$(docker port image-smoke 80/tcp | awk -F: '{print $NF}')"
          curl --fail --silent --show-error --retry 60 --retry-delay 5 \
            --retry-all-errors "http://127.0.0.1:$port/api/health" > measurements/health.json
          python3 -c 'import json,os; h=json.load(open("measurements/health.json")); assert h["error"] is None, h; assert h["gitinfo"]["commit_hash"]==os.environ["GITHUB_SHA"], h'
      - name: Run targeted regressions
        run: |
          set -euo pipefail
          docker exec -e PYTHONPATH=/a0 -w /a0 image-smoke bash -lc '
            set -euo pipefail
            if ! /opt/venv-a0/bin/python -m pytest --version; then
              uv pip install --python /opt/venv-a0/bin/python pytest==8.3.5
            fi
            /opt/venv-a0/bin/python -m pytest -q \
              tests/test_external_speech.py tests/test_cpu_whisper_wheel.py \
              tests/test_speech_frontend.py tests/test_kokoro_tts.py \
              tests/test_speech_plugin_split.py tests/test_image_footprint_checks.py \
              tests/test_libreoffice_conversion.py
            /opt/venv-a0/bin/python -m pytest -q \
              tests/test_image_features.py tests/test_image_feature_runtime.py \
              tests/test_plugin_activation_ui.py tests/test_plugin_hook_context.py
          ' 2>&1 | tee measurements/targeted-tests.log
      - name: Run real retained-feature and omission checks
        if: always() && steps.startup.outcome == 'success'
        run: |
          set -euo pipefail
          timeout 1500 docker exec -e PYTHONPATH=/a0 -w /a0 image-smoke \
            /opt/venv-a0/bin/python /checks/smoke.py --dockerized=true \
            2>&1 | tee measurements/smoke.log
      - name: Preserve runtime diagnostics
        if: always()
        run: |
          mkdir -p measurements
          if docker inspect image-smoke >/dev/null 2>&1; then
            docker logs image-smoke > measurements/startup.log 2>&1
            docker cp image-smoke:/tmp/image-smoke-results.json measurements/smoke-results.json || \
              echo "Smoke runner did not produce results; inspect startup and smoke logs." >&2
            docker rm -f image-smoke
          fi
      - name: Publish only the functionally checked experimental image
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_experimental
        run: docker push "$IMAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-candidate-${{ matrix.architecture }}
          path: measurements
          if-no-files-found: warn

  publish-index:
    needs: candidate
    if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_experimental
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked multi-architecture experimental tag
        env:
          IMAGE: ${{ needs.candidate.outputs.image_base }}
        run: |
          test -n "$IMAGE"
          docker buildx imagetools create --tag "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker buildx imagetools inspect "$IMAGE"
