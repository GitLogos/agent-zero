<html>
<head>
  <title>Whisper STT</title>
</head>

<body>
  <div x-data>
    <template x-if="config">
      <div class="plugin-config-page" x-init="if (config.backend === undefined) config.backend = 'local'; if (config.request_timeout === undefined) config.request_timeout = 120">
        <div class="section-title">Whisper STT</div>
        <div class="section-description">
          Choose local CPU Whisper or an OpenAI-compatible audio service. Browser microphone
          device selection stays local to the Web UI and is managed from the plugin status panel.
        </div>

        <div class="field">
          <div class="field-label">
            <div class="field-title">Backend</div>
            <div class="field-description">Local is the default. External sends recorded audio to your configured service; errors never switch back to local.</div>
          </div>
          <div class="field-control">
            <select x-model="config.backend">
              <option value="local" :disabled="$store.whisperStt?.localAvailable === false">Local Whisper (CPU)</option>
              <option value="openai">External OpenAI-compatible API</option>
            </select>
          </div>
        </div>

        <div class="section-description" x-show="$store.whisperStt?.localAvailable === false">
          Local Whisper was excluded at image build time. Select and configure the external backend; recordings are not sent anywhere until you explicitly configure it.
        </div>

        <div x-show="config.backend === 'openai'">
          <div class="field">
            <div class="field-label"><div class="field-title">Base URL</div><div class="field-description">Include the API prefix, for example https://provider.example/v1. An origin-only URL uses /v1. No query parameters or embedded credentials.</div></div>
            <div class="field-control"><input type="url" x-model.trim="config.external_base_url" placeholder="http://speech-server:8000/v1" /></div>
          </div>
          <div class="field">
            <div class="field-label"><div class="field-title">API key</div><div class="field-description">Saved in authenticated server-side plugin settings. Leave empty for keyless local services.</div></div>
            <div class="field-control"><input type="password" x-model="config.external_api_key" autocomplete="off" /></div>
          </div>
          <div class="field">
            <div class="field-label"><div class="field-title">External model</div><div class="field-description">Model identifier accepted by POST /audio/transcriptions. The saved local model size is not sent.</div></div>
            <div class="field-control"><input type="text" x-model.trim="config.external_model" placeholder="whisper-1" /></div>
          </div>
          <div class="field">
            <div class="field-label"><div class="field-title">Request timeout</div><div class="field-description">Total external request time in seconds, including response download.</div></div>
            <div class="field-control"><input type="number" min="1" x-model.number="config.request_timeout" /></div>
          </div>
        </div>

        <div class="field" x-show="config.backend === 'local'">
          <div class="field-label">
            <div class="field-title">Model Size</div>
            <div class="field-description">
              Whisper model variant loaded by the backend runtime.
            </div>
          </div>
          <div class="field-control">
            <select x-model="config.model_size">
              <option value="tiny">Tiny</option>
              <option value="base">Base</option>
              <option value="small">Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
              <option value="turbo">Turbo</option>
            </select>
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            <div class="field-title">Language</div>
            <div class="field-description">
              Use <code>auto</code> for detection. External services require a two-letter ISO language code, such as <code>en</code>; language names are local-only.
            </div>
          </div>
          <div class="field-control">
            <input type="text" x-model="config.language" placeholder="en" />
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            <div class="field-title">Voice Message Handling</div>
            <div class="field-description">
              Choose whether final transcriptions are sent immediately or left in the composer for review.
            </div>
          </div>
          <div class="field-control">
            <select x-model="config.message_mode">
              <option value="send">Send immediately</option>
              <option value="draft">Draft in composer</option>
            </select>
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            <div class="field-title">Silence Threshold</div>
            <div class="field-description">
              Minimum detected signal before voice input switches from listening to recording.
            </div>
          </div>
          <div class="field-control">
            <input type="range" min="0" max="1" step="0.01" x-model.number="config.silence_threshold" />
            <span class="range-value" x-text="config.silence_threshold"></span>
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            <div class="field-title">Silence Duration</div>
            <div class="field-description">
              Milliseconds of silence required before the recording enters the waiting phase.
            </div>
          </div>
          <div class="field-control">
            <input type="number" min="100" step="100" x-model.number="config.silence_duration" />
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            <div class="field-title">Waiting Timeout</div>
            <div class="field-description">
              Milliseconds to wait after silence before audio is sent for transcription.
            </div>
          </div>
          <div class="field-control">
            <input type="number" min="100" step="100" x-model.number="config.waiting_timeout" />
          </div>
        </div>
      </div>
    </template>
  </div>
</body>
</html>
